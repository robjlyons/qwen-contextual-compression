[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-contextual-compression"
version = "0.1.0"
description = "Oracle contextual FFN sparsity experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "transformers>=4.57", "accelerate>=1.0", "numpy>=1.24", "pandas>=2", "matplotlib>=3.7", "pyyaml>=6"]

[project.optional-dependencies]
datasets = ["datasets>=3"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["extract*", "oracle*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

